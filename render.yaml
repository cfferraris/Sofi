services:
  - type: web
    name: sofi-appointments-audit
    runtime: node
    plan: free
    branch: audit/fix-site-baseline
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sofi-appointments-audit-db
          property: connectionString
      - key: CONTACT_EMAIL
        value: contacto@pieldemar.com
      - key: DATA_RETENTION_DAYS
        value: "90"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: sofi-appointments-audit-db
    plan: free
    databaseName: sofi_appointments
    user: sofi_appointments
