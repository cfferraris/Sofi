name: P0 appointment UX corrections v2
on:
  push:
    branches:
      - audit/fix-site-baseline
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/fix-site-baseline
          fetch-depth: 0
      - name: Apply corrections
        run: python3 scripts/apply-p0-appointment-ux-v2.py
      - name: Verify
        run: |
          npm run check
          npm test
      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/main.js
          git diff --cached --check
          git commit -m "fix: refine appointment WhatsApp UX"
          git push origin HEAD:audit/fix-site-baseline
