name: Optimize site images
on:
  push:
    branches:
      - audit/fix-site-baseline
    paths:
      - '.github/workflows/optimize-images.yml'
      - 'assets/img/**'
      - 'index.html'
      - 'scripts/optimize_images.py'
  workflow_dispatch:
concurrency:
  group: site-generated-assets
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/fix-site-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate WebP derivatives and update references twice to verify idempotency
        run: |
          python scripts/optimize_images.py
          sha256sum index.html css/styles.css docs/image-optimization-report.md > /tmp/optimizer-first.sha256
          python scripts/optimize_images.py
          sha256sum index.html css/styles.css docs/image-optimization-report.md > /tmp/optimizer-second.sha256
          diff -u /tmp/optimizer-first.sha256 /tmp/optimizer-second.sha256
      - name: Commit generated assets and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img index.html css/styles.css docs/image-optimization-report.md
          if git diff --cached --quiet; then echo 'No changes to commit'; exit 0; fi
          git commit -m 'perf: optimize heavy site images as WebP'
          git push origin HEAD:audit/fix-site-baseline