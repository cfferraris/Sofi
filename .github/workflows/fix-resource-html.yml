name: Fix resource catalog markup
on:
  push:
    branches: [audit/fix-site-baseline]
    paths: [.github/workflows/fix-resource-html.yml, scripts/fix_resource_html.py]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/fix-site-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_resource_html.py
      - run: npx --yes esbuild@0.25.11 css/styles.css --minify --outfile=css/styles.min.css && npx --yes esbuild@0.25.11 js/main.js --minify --outfile=js/main.min.js
      - name: Validate HTML structure
        run: python3 -c "from pathlib import Path; from html.parser import HTMLParser; HTMLParser().feed(Path('recursos.html').read_text()); print('HTML parsed')"
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recursos.html css/styles.min.css
          git commit -m 'fix: correct resource catalog markup'
          git push origin HEAD:audit/fix-site-baseline
