name: Site smoke tests

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check js/main.js
      - name: Validate legacy appointments JSON syntax
        run: node -e "JSON.parse(require('node:fs').readFileSync('data/appointments.json', 'utf8'))"
      - name: Run static smoke tests
        run: node --test tests/site-smoke.test.mjs
