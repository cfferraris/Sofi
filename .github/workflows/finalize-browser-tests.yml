name: Finalize browser coverage
on:
  push:
    branches: [audit/fix-site-baseline]
    paths: [.github/workflows/finalize-browser-tests.yml, scripts/patch_browser_tests.py, tests/resources-browser.test.mjs, tests/site-smoke.test.mjs, tests/site-browser.test.mjs, tests/production-flow-audit.mjs, css/styles.css, css/styles.min.css, package.json, index.html]
concurrency:
  group: site-generated-assets
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/fix-site-baseline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_browser_tests.py
      - run: npm install --no-save --package-lock=false playwright @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run check && npm test && npm run test:e2e
      - name: Commit
        run: |
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/site-browser.test.mjs tests/resources-browser.test.mjs tests/site-smoke.test.mjs tests/production-flow-audit.mjs scripts/patch_browser_tests.py css/styles.css css/styles.min.css package.json
          git commit -m 'test: finalize redesigned site accessibility coverage'
          git push origin HEAD:audit/fix-site-baseline
