name: Lighthouse staging audit
# Re-run post-change Lighthouse measurements when this audit workflow is updated.
# Post-LCP-fix validation: require a fresh staging run after generated assets are committed.

on:
  push:
    branches:
      - audit/fix-site-baseline
    paths:
      - '.github/workflows/lighthouse-staging.yml'
      - 'index.html'
      - 'privacidad.html'
      - 'assets/**'
      - 'scripts/optimize_images.py'
      - 'css/**'
      - 'js/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-staging.yml'
      - 'docs/technical-audit-closure.md'
      - 'index.html'
      - 'privacidad.html'
      - 'assets/**'
      - 'scripts/optimize_images.py'
      - 'css/**'
      - 'js/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-staging-audit-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for Render staging to serve the latest image references
        shell: bash
        run: |
          set -euo pipefail
          url="https://sofi-ywgo.onrender.com/"
          ready=0
          for attempt in $(seq 1 30); do
            html="$(curl -fsSL --max-time 20 "$url" || true)"
            js="$(curl -fsSL --max-time 20 https://sofi-ywgo.onrender.com/js/main.min.js || true)"
            css="$(curl -fsSL --max-time 20 https://sofi-ywgo.onrender.com/css/styles.min.css || true)"
            if [ -n "$html" ] && grep -q '\.webp' <<< "$html" && grep -q 'width="440"' <<< "$html" && grep -q 'height="317"' <<< "$html" && grep -q 'srcset=' <<< "$html" && grep -Eq 'HERO_AUTO_TRIGGER_MS:(1000|1e3)' <<< "$js" && grep -q 'HERO_NAVBAR_SHOW_MS:700' <<< "$js" && grep -q 'HERO_CONTENT_SHOW_MS:800' <<< "$js" && grep -q 'HERO_HIDE_MS:1e3' <<< "$js" && grep -q '\.hero{position:absolute' <<< "$css"; then
              printf '%s' "$html" > /tmp/staging-index.html
              echo "Staging serves the current HTML, CSS and JavaScript performance fixes (attempt $attempt)."
              ready=1
              break
            fi
            echo "Staging not ready with expected content (attempt $attempt/30); retrying in 10 seconds."
            sleep 10
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Staging did not serve the expected WebP references within 5 minutes."
            exit 1
          fi
      - name: Verify optimized images and minified assets are served
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import quote
          html = Path('/tmp/staging-index.html').read_text()
          refs = set(re.findall(r"""(?:src|poster)=["']([^"']+\.webp(?:\?[^"']*)?)["']""", html, re.IGNORECASE))
          for srcset in re.findall(r"""srcset=["']([^"']+)["']""", html, re.IGNORECASE):
              refs.update(re.findall(r'([^\s,]+\.webp)(?:\s+\d+w)?', srcset, re.IGNORECASE))
          refs = sorted(refs)
          if not refs:
              raise SystemExit('No WebP src/poster/srcset references found in staging HTML')
          print(f'Found {len(refs)} unique WebP references in HTML and responsive srcsets')
          for ref in refs:
              path = ref.split('?', 1)[0]
              if path.startswith(('http://', 'https://')):
                  url = path
              else:
                  url = 'https://sofi-ywgo.onrender.com/' + quote(path.lstrip('/'), safe='/%')
              result = subprocess.run(['curl', '-sS', '-L', '-o', '/dev/null', '-w', '%{http_code} %{size_download}', '--max-time', '20', url], capture_output=True, text=True)
              if result.returncode or not result.stdout.startswith('200 '):
                  raise SystemExit(f'Asset check failed: {url} => {result.stdout.strip()} {result.stderr.strip()}')
              print(f'OK {result.stdout.strip()} {url}')
          PY
          for asset in css/styles.min.css js/main.min.js; do
            result="$(curl -sS -L -o /dev/null -w '%{http_code} %{size_download}' --max-time 20 "https://sofi-ywgo.onrender.com/$asset")"
            if [[ "$result" != 200* ]]; then
              echo "::error::Minified asset check failed: $asset => $result"
              exit 1
            fi
            echo "OK $result $asset"
          done

          check_minified_pair() {
            source="$1"
            minified="$2"
            source_bytes="$(curl -fsSL --max-time 20 "https://sofi-ywgo.onrender.com/$source" | wc -c)"
            minified_bytes="$(curl -fsSL --max-time 20 "https://sofi-ywgo.onrender.com/$minified" | wc -c)"
            if [ "$minified_bytes" -ge "$source_bytes" ]; then
              echo "::error::Minified asset is not smaller: $source ($source_bytes B) vs $minified: $minified_bytes B"
              exit 1
            fi
            echo "OK $source: $source_bytes B -> $minified: $minified_bytes B"
          }
          check_minified_pair css/styles.css css/styles.min.css
          check_minified_pair js/main.js js/main.min.js
          deployed_js="$(curl -fsSL --max-time 20 https://sofi-ywgo.onrender.com/js/main.min.js)"
          if ! grep -Eq 'HERO_AUTO_TRIGGER_MS:(1000|1e3)' <<< "$deployed_js" || ! grep -q 'HERO_NAVBAR_SHOW_MS:700' <<< "$deployed_js" || ! grep -q 'HERO_CONTENT_SHOW_MS:800' <<< "$deployed_js" || ! grep -q 'HERO_HIDE_MS:1e3' <<< "$deployed_js"; then
            echo "::error::Staging does not serve the expected hero transition timings."
            exit 1
          fi
          echo "OK deployed hero transition timings are 1000 / 700 / 800 / 1000 ms"

          curl -fsSL --max-time 20 https://sofi-ywgo.onrender.com/css/styles.min.css -o /tmp/styles.min.css
          grep -q '\.hero{position:absolute' /tmp/styles.min.css || { echo "::error::Hero must be out of document flow to prevent CLS."; exit 1; }
          grep -q '\.main-content{opacity:0;transform:none' /tmp/styles.min.css || { echo "::error::Main content reveal must not translate the full page."; exit 1; }
          curl -fsSL --max-time 20 https://sofi-ywgo.onrender.com/ -o /tmp/staging-index.html
          grep -A5 'id="mainLogo"' /tmp/staging-index.html | grep -q 'width="440"' || { echo "::error::Hero logo width attribute is incorrect."; exit 1; }
          grep -A5 'id="mainLogo"' /tmp/staging-index.html | grep -q 'height="317"' || { echo "::error::Hero logo height attribute is incorrect."; exit 1; }
          echo "OK hero flow, main-content reveal and logo aspect ratio"

          if ! grep -q 'src="assets/img/logos/Isotipo2/Azul.webp"' /tmp/staging-index.html; then
            echo "::error::Staging HTML does not reference the optimized navbar isotipo."
            exit 1
          fi
          if ! grep -q 'href="assets/img/logos/Isotipo2/Azul.png" type="image/png"' /tmp/staging-index.html; then
            echo "::error::PNG favicon/touch icon references must remain unchanged."
            exit 1
          fi
          isotipo_result="$(curl -sS -L -o /dev/null -w '%{http_code} %{size_download}' --max-time 20 https://sofi-ywgo.onrender.com/assets/img/logos/Isotipo2/Azul.webp)"
          if [[ "$isotipo_result" != 200* ]]; then
            echo "::error::Optimized navbar isotipo failed: $isotipo_result"
            exit 1
          fi
          isotipo_bytes="${isotipo_result#* }"
          if [ "$isotipo_bytes" -ge 5000 ]; then
            echo "::error::Optimized navbar isotipo is unexpectedly large: $isotipo_bytes bytes"
            exit 1
          fi
          echo "OK optimized navbar isotipo: $isotipo_result"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Lighthouse mobile
        run: |
          mkdir -p reports
          npx --yes lighthouse@13.5.0 https://sofi-ywgo.onrender.com/ \
            --chrome-flags="--headless --no-sandbox" \
            --form-factor=mobile --screenEmulation.mobile=true \
            --output=json --output=html --output-path=./reports/mobile \
            --quiet
      - name: Run Lighthouse desktop
        run: |
          npx --yes lighthouse@13.5.0 https://sofi-ywgo.onrender.com/ \
            --chrome-flags="--headless --no-sandbox" \
            --form-factor=desktop --screenEmulation.mobile=false \
            --output=json --output=html --output-path=./reports/desktop \
            --quiet
      - name: Summarize scores and Core Web Vitals
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const device of ['mobile', 'desktop']) {
            const path = `reports/${device}.report.json`;
            if (!fs.existsSync(path)) {
              console.log(`${device}: report not generated`);
              continue;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const cats = report.categories || {};
            const audits = report.audits || {};
            const score = id => cats[id]?.score == null ? 'N/A' : Math.round(cats[id].score * 100);
            const metric = id => audits[id]?.displayValue || audits[id]?.numericValue || 'N/A';
            console.log(JSON.stringify({
              device,
              performance: score('performance'),
              accessibility: score('accessibility'),
              bestPractices: score('best-practices'),
              seo: score('seo'),
              lcp: metric('largest-contentful-paint'),
              cls: metric('cumulative-layout-shift'),
              tbt: metric('total-blocking-time'),
              speedIndex: metric('speed-index'),
              fcp: metric('first-contentful-paint'),
              report: path
            }, null, 2));
          }
          NODE
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-staging-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
